<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyu Zhong | Minimal Organic Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F5F5F5; /* 温暖的艺术纸张色 */
            --text-color: #4A4A4A; /* 深灰而非纯黑，降低对比度 */
            --font-serif: 'Cormorant Garamond', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: var(--font-serif);
        }

        /* 画布背景 */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 覆盖层：增加噪点质感，让画面更像纸张 */
        .paper-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.05;
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
        }

        /* 内容区域 */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: var(--text-color);
            pointer-events: none;
        }

        .name {
            font-size: 2rem;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
            font-weight: 400;
            opacity: 0.8;
        }

        .quote {
            font-size: 1.2rem;
            font-style: italic;
            line-height: 1.8;
            letter-spacing: 0.05em;
            opacity: 0.6;
        }

        .explore {
            margin-top: 60px;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            text-decoration: none;
            color: var(--text-color);
            border-bottom: 1px solid rgba(74, 74, 74, 0.2);
            padding-bottom: 5px;
            pointer-events: auto;
            transition: all 0.5s ease;
        }

        .explore:hover {
            opacity: 0.5;
            border-bottom: 1px solid rgba(74, 74, 74, 0.5);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="paper-texture"></div>

    <div class="content">
        <h1 class="name">SIYU ZHONG</h1>
        <p class="quote">
            silent whispers of the bone<br>
            fluid shadows in the light
        </p>
        <div style="margin-top: 50px;">
            <a href="#" class="explore">ENTER GALLERY</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 120; // 粒子数量，越多越浓郁
        
        // 颜色池：从你的画作中提取的浅灰、米白、极淡的灰绿
        const colors = [
            'rgba(200, 200, 200, 0.03)',
            'rgba(180, 185, 170, 0.02)',
            'rgba(220, 210, 200, 0.03)',
            'rgba(150, 150, 150, 0.01)'
        ];

        function init() {
            resize();
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 80 + 20; // 较大的尺寸产生云雾感
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.history = [];
                this.maxLength = Math.random() * 100 + 50;
            }

            update() {
                // 使用简单的简谐运动模拟有机流动
                this.vx += Math.sin(this.y * 0.01 + Date.now() * 0.001) * 0.02;
                this.vy += Math.cos(this.x * 0.01 + Date.now() * 0.001) * 0.02;
                
                this.x += this.vx;
                this.y += this.vy;

                // 边界检查
                if (this.x < -100 || this.x > width + 100 || this.y < -100 || this.y > height + 100) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.fillStyle = this.color;
                // 绘制模糊的圆形，模拟扩散的水墨块
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            // 注意：这里我们不完全清除画布，而是覆盖一层极透明的背景
            // 这样会留下淡淡的移动痕迹，形成“渗开”的效果
            ctx.fillStyle = 'rgba(245, 245, 245, 0.05)'; 
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>
